<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="rating" content="adult">
<meta name="description" content="人外好きが、人外好きのために選ぶ。獣人・竜・鬼・怪異・機械など、人ならざるものが登場する成人向け作品を紹介・語るブログ。">
<meta property="og:title" content="人外ノ閨｜ヒトでは満たされない夜に。">
<meta property="og:description" content="人外好きが、人外好きのために選ぶ。人外ジャンルの解説と作品紹介。">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<title>人外ノ閨 段階A試作</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@600;700&display=swap">
<style>
:root{
  /* 段階A：記事が主役の語りブログ。暗い地に明朝の見出し、黄土色のアクセント、本文は読みやすい1カラム */
  --bg:#15161B; --bg-deep:#0E0F12; --surface:#1E2028; --surface-2:#262833; --ph:#23252D; --line:#2E313B; --line-strong:#41444F;
  --text:#ECE9E2; --text-sub:#CFCCC4; --muted:#B3B0A8; --accent:#E2B45C; --on-accent:#1A1408; --danger:#F09A8A;
  --display:'Zen Old Mincho','Noto Serif JP',serif;
  --body:'Zen Kaku Gothic New','Hiragino Sans','Noto Sans JP',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.8}
a{color:var(--text)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.4}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
.proto{background:var(--accent);color:var(--on-accent);font-size:12px;font-weight:700;text-align:center;padding:4px 12px}
.agebar{background:var(--bg-deep);border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);text-align:center;padding:6px 16px}
header.site{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.hrow{height:64px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{text-decoration:none;display:flex;align-items:baseline;flex-wrap:wrap;gap:0 12px;min-width:0}
.logo b{font-family:var(--display);font-size:22px;letter-spacing:.08em}
.logo span{font-family:var(--display);font-size:12px;color:var(--text-sub);letter-spacing:.06em}
.icons{display:flex;gap:2px}
.ibtn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:transparent;border:0;border-radius:8px;cursor:pointer}
.ibtn:hover{background:var(--surface)}
.panel{border-top:1px solid var(--line-strong);background:var(--surface);max-height:75vh;overflow-y:auto;box-shadow:0 12px 24px rgba(0,0,0,.45)}
.panel[hidden]{display:none}
.sform{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 0}
.sform label{font-size:13px;color:var(--muted)}
.sform input{flex:1 1 220px;min-width:0;height:44px;padding:0 14px;background:var(--bg);border:1px solid var(--line-strong);border-radius:8px;color:var(--text)}
.btn{height:44px;padding:0 20px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;border:1px solid var(--line-strong);background:transparent;text-decoration:none;font-weight:500;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.btn.small{height:36px;padding:0 14px;font-size:13px}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;padding:16px 16px 20px}
.menu .mg{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.menu h3{font-family:var(--body);font-size:12px;color:var(--accent);letter-spacing:.1em;font-weight:700;margin:2px 0 4px}
.menu a{display:flex;justify-content:space-between;align-items:center;min-height:40px;padding:0 4px;border-top:1px solid var(--line);text-decoration:none;font-weight:500;font-size:14px;color:var(--text)}
.menu a::after{content:'›';color:var(--muted)}
.menu a:hover{color:var(--accent)}
main{padding:28px 0 64px}
.stack{display:flex;flex-direction:column;gap:44px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.sec-head h2{font-size:21px}
.more{font-size:14px;color:var(--text-sub)}
.note{font-size:12px;color:var(--muted)}
.hero{display:flex;flex-direction:column;gap:12px;border-bottom:1px solid var(--line);padding:8px 0 28px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.1em;color:var(--accent)}
.hero h1{font-size:30px;letter-spacing:.04em}
.hero p{margin:0;color:var(--text-sub);max-width:34em}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.chipwrap{display:flex;gap:8px;flex-wrap:wrap}
.chip{flex:0 0 auto;min-height:40px;padding:0 14px;display:inline-flex;align-items:center;background:#1F2027;border:1px solid #33363F;border-radius:999px;font-size:14px;font-weight:500;white-space:nowrap;text-decoration:none;cursor:pointer}
.chip.on,.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.layout{display:flex;flex-wrap:wrap;gap:40px}
.layout .main{flex:999 1 560px;min-width:0}
.layout .side{flex:1 1 260px;display:flex;flex-direction:column;gap:24px}
.feature{display:flex;flex-wrap:wrap;gap:20px;text-decoration:none;margin-bottom:20px}
.feature .eye{flex:1 1 280px}
.feature .txt{flex:999 1 260px;min-width:0;display:flex;flex-direction:column;gap:8px}
.feature h3{font-size:22px}
.eye{aspect-ratio:16/9;background:var(--ph);border:1px solid #2E3039;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#9C9A93;font-size:12px}
.eye .glyph{font-family:var(--display);font-size:30px;color:#4A4C56}
.list{display:flex;flex-direction:column}
.row{display:flex;gap:16px;padding:16px 0;border-bottom:1px solid var(--line);text-decoration:none}
.row .eye{flex:0 0 132px;width:132px;align-self:flex-start}
.row .txt{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:4px}
.row b{font-size:16px;line-height:1.5}
.lab{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px}
.cat{font-weight:700;color:var(--accent)}
.tag{font-size:11px;padding:0 8px;border:1px solid var(--line-strong);border-radius:999px;color:var(--text-sub)}
.excerpt{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.box h2{font-size:17px;margin-bottom:10px}
.box p{margin:0;font-size:14px;color:var(--text-sub)}
.box ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:8px;font-size:14px}
.box ol a{text-decoration:none}
.gl{display:flex;flex-direction:column;gap:12px}
.gl h3{font-family:var(--body);font-size:12px;color:var(--muted);font-weight:500;margin-bottom:4px}
.gl .links{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:14px}
.crumb{font-size:13px;color:var(--muted);margin-bottom:18px;display:flex;gap:6px;flex-wrap:wrap}
.crumb a{color:var(--text-sub)}
.article{max-width:680px}
.article h1{font-size:28px;margin:8px 0 10px}
.article h2{font-size:20px;margin:36px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.article h3{font-size:16px;margin:20px 0 6px;color:var(--text)}
.article p{color:var(--text-sub);margin:0 0 14px}
.article ul,.article ol.body{color:var(--text-sub);padding-left:1.3em;margin:0 0 14px}
.article li{margin-bottom:8px}
.article li b{color:var(--text)}
.article .eye{margin:16px 0}
.toc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin:18px 0}
.toc ol{margin:6px 0 0;padding-left:1.4em}
.toc a{color:var(--text-sub);text-decoration:none}
.glist{display:flex;flex-direction:column;gap:10px;margin:0 0 14px}
.gitem{border-left:2px solid var(--accent);padding:2px 0 2px 12px;border-radius:0}
.gitem b{display:block;color:var(--text)}
.gitem span{color:var(--text-sub);font-size:14px}
.scale{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0 18px}
.scale div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 10px;text-align:center;display:flex;flex-direction:column;gap:2px}
.scale small{color:var(--accent);font-weight:700;font-size:12px}
.scale b{font-size:14px}
.scale span{font-size:12px;color:var(--muted);line-height:1.5}
.bar{height:6px;border-radius:3px;background:linear-gradient(90deg,#3A3D47,var(--accent));margin:4px 0 6px}
.callout{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 14px;font-size:14px;color:var(--text-sub)}
.work{border:1px solid var(--line-strong);border-radius:12px;padding:16px;margin:14px 0 18px;display:flex;flex-direction:column;gap:6px}
.work .wl{font-size:11px;letter-spacing:.1em;color:var(--muted)}
.work b{font-size:17px;font-family:var(--display)}
.work .meta{font-size:13px;color:var(--muted)}
.work a{align-self:flex-start;margin-top:6px;font-size:14px;color:var(--text-sub)}
.author{display:flex;gap:14px;align-items:flex-start;margin-top:32px}
.avatar{flex:0 0 56px;height:56px;border-radius:50%;background:var(--bg-deep);border:1px solid var(--accent);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:24px}
.comments{margin-top:40px}
.comments h2{margin-top:0}
.cmt{border-bottom:1px solid var(--line);padding:14px 0;display:flex;flex-direction:column;gap:4px}
.cmt .who{font-size:13px;font-weight:700}
.cmt .who span{font-weight:400;color:var(--muted);margin-left:8px}
.cmt p{margin:0;color:var(--text-sub);white-space:pre-wrap;word-break:break-word}
.cform{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.cform label{font-size:13px;color:var(--muted)}
.cform input,.cform textarea{background:var(--bg);border:1px solid var(--line-strong);border-radius:8px;padding:10px 12px;color:var(--text);width:100%}
.cform textarea{min-height:110px;resize:vertical}
.cform .err{color:var(--danger);font-size:13px;min-height:1.2em}
.cstatus{font-size:13px;border-radius:8px;padding:10px 12px;margin-top:6px}
.cstatus.ok{background:#1E2A22;color:#A8DBB5}
.cstatus.ng{background:#2E1F1D;color:var(--danger)}
.cstatus.wait{background:var(--surface);color:var(--muted)}
.picker{display:flex;flex-direction:column;gap:14px;margin-bottom:22px}
.picker fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.picker legend{font-size:13px;color:var(--muted);margin-bottom:6px;padding:0}
.picker .grp{font-size:12px;color:var(--muted);margin-top:4px}
.selbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--text-sub)}
.empty{padding:40px 0;text-align:center;color:var(--muted)}
footer.site{border-top:1px solid var(--line);background:var(--bg-deep)}
.foot{padding:28px 0;display:flex;flex-direction:column;gap:12px;font-size:13px;color:var(--muted)}
.foot nav{display:flex;flex-wrap:wrap;gap:6px 22px}
.foot a{color:var(--text-sub)}
.foot button{background:none;border:0;padding:0;color:var(--text-sub);text-decoration:underline;cursor:pointer;font-size:13px}
.gate{position:fixed;inset:0;z-index:100;background:rgba(10,10,13,.94);display:flex;align-items:center;justify-content:center;padding:20px}
.gate[hidden]{display:none}
.gate .gbox{max-width:420px;width:100%;background:var(--surface);border:1px solid var(--line-strong);border-radius:14px;padding:28px 22px;display:flex;flex-direction:column;gap:14px;text-align:center}
.gate h2{font-size:26px;letter-spacing:.08em}
.gate p{margin:0;color:var(--text-sub);font-size:14px}
.gate .grow{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.diag{border:1px solid var(--accent);border-radius:14px;overflow:hidden;margin:16px 0 22px;background:var(--surface)}
.dhead{background:var(--surface-2);padding:10px 16px;display:flex;flex-direction:column;border-bottom:1px solid var(--line)}
.dhead span{font-size:11px;letter-spacing:.14em;color:var(--accent);font-weight:700}
.dhead b{font-family:var(--display);font-size:17px}
.dbody{padding:18px 16px 20px;display:flex;flex-direction:column;gap:12px;min-height:170px}
.dq-k{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.08em}
.dq{font-size:18px;line-height:1.55;color:var(--text)}
.dr{font-family:var(--display);font-size:21px;color:var(--accent);line-height:1.45}
.dbody p{margin:0;color:var(--text-sub);font-size:14px}
.dans{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:4px}
.dans .btn{height:52px;font-size:16px}
.dnav{display:flex;gap:8px;flex-wrap:wrap}
.eye.art{position:relative;overflow:hidden;padding:0}
.eye.art svg{width:100%;height:100%;display:block}
.eyetag{position:absolute;right:6px;bottom:6px;font-size:10px;background:rgba(14,15,18,.75);color:var(--muted);padding:1px 6px;border-radius:4px}
.fig{margin:16px 0 20px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.fig svg{display:block;width:100%;aspect-ratio:16/9;height:auto}
.fig figcaption{padding:8px 12px;font-size:13px;color:var(--text-sub);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.fig figcaption span{font-size:11px;color:var(--muted)}
.figrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:14px 0 18px}
.fig.small{margin:0}
.fig.small figcaption{font-size:12px;padding:6px 10px}
.scale div svg{width:100%;aspect-ratio:16/9;border-radius:6px;margin-bottom:6px}
.axes{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0 18px}
.ax b{font-size:14px;color:var(--accent)}
.axl{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text-sub)}
.axl i{flex:1;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--line-strong),var(--accent))}
.axl span{flex:0 0 auto}
.dprog{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);font-weight:700}
.dpbar{flex:1;height:4px;border-radius:2px;background:var(--line-strong);overflow:hidden}
.dpbar i{display:block;height:100%;background:var(--accent)}
.dwin{display:flex;flex-wrap:wrap;gap:12px;align-items:center;background:var(--surface-2);border:1px solid var(--accent);border-radius:12px;padding:10px}
.dwin svg{flex:0 0 120px;width:120px;aspect-ratio:16/9;border-radius:8px}
.dwin p{font-size:13px}
.dwin>div{flex:1 1 180px;min-width:0}
.bars{display:flex;flex-direction:column;gap:8px}
.brow{display:grid;grid-template-columns:44px minmax(0,7.5em) 1fr 3em;align-items:center;gap:8px;font-size:13px;color:var(--text-sub)}
.bico svg{width:44px;height:28px;border-radius:5px;display:block}
.bname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btrack{height:10px;border-radius:5px;background:var(--bg);border:1px solid var(--line)}
.btrack i{display:block;height:100%;border-radius:5px;background:var(--line-strong)}
.brow.top{color:var(--text);font-weight:700}
.brow.top .btrack i{background:var(--accent)}
.bpct{text-align:right;font-variant-numeric:tabular-nums}
.tug{display:flex;flex-direction:column;gap:8px}
.tugends{display:flex;justify-content:space-between;gap:10px}
.tugends span{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px}
.tugends svg{width:96px;aspect-ratio:16/9;border-radius:8px}
.tugbar{position:relative;height:12px;border-radius:6px;background:#3A5A6E}
.tugbar i{position:absolute;left:0;top:0;bottom:0;border-radius:6px 0 0 6px;background:var(--accent)}
.tugbar em{position:absolute;top:-5px;width:4px;height:22px;margin-left:-2px;background:var(--text);border-radius:2px}
.tugpct{display:flex;justify-content:space-between;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.hito{display:flex;gap:12px;align-items:flex-start;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px;margin:24px 0 8px}
.hito b{font-size:14px;color:var(--accent)}
.hito p{margin:4px 0 2px!important;font-size:14px}
.hito small{font-size:11px;color:var(--muted)}
.xshare{align-self:flex-start;gap:8px;background:#0E0F12;border-color:var(--line-strong)}
.crowd{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.crowd summary{cursor:pointer;font-size:13px;color:var(--text-sub);font-weight:700}
.crowd .bars{margin-top:10px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.turnstile{border:1px dashed var(--line-strong);border-radius:8px;padding:12px;font-size:12px;color:var(--muted);text-align:center}
.sel{height:44px;background:var(--bg);color:var(--text);border:1px solid var(--line-strong);border-radius:8px;padding:0 10px}
table.spec{width:100%;border-collapse:collapse;font-size:14px;margin-bottom:12px}
table.spec th{text-align:left;font-weight:500;color:var(--muted);width:7.5em;padding:10px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.spec td{padding:10px 0;border-bottom:1px solid var(--line);color:var(--text-sub)}
.check{display:flex;align-items:center;gap:8px}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.carousel{position:relative}
.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;scrollbar-width:none;border-radius:12px}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;text-decoration:none;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.slide .eye{border:0;border-radius:0;aspect-ratio:21/9}
.slide .st{padding:14px 16px 18px;display:flex;flex-direction:column;gap:6px}
.slide .st small{color:var(--accent);font-weight:700;font-size:12px;letter-spacing:.08em}
.slide .st b{font-family:var(--display);font-size:20px;line-height:1.45}
.slide .st span{font-size:13px;color:var(--muted)}
.cnav{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:10px}
.cnav button.arrow{width:40px;height:40px;border-radius:50%;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center}
.dots{display:flex;gap:8px}
.dots button{width:10px;height:10px;border-radius:50%;border:0;padding:0;background:var(--line-strong);cursor:pointer}
.dots button[aria-current="true"]{background:var(--accent)}
@media (max-width:480px){.row .eye{flex-basis:104px;width:104px}.hero h1{font-size:26px}.scale{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="proto">段階A試作：記事・コメントは見本です（コメントはこの画面の中だけで動きます）</div>
<div class="agebar">このサイトは18歳以上の方を対象としています</div>
<header class="site">
  <div class="wrap hrow">
    <a class="logo" href="#home"><b>人外ノ閨</b><span>ヒトでは満たされない夜に。</span></a>
    <div class="icons">
      <button class="ibtn" id="btn-search" type="button" aria-label="検索（タグとキーワード）">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      </button>
      <button class="ibtn" id="btn-menu" type="button" aria-label="メニュー" aria-expanded="false" aria-controls="panel-menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16"></path><path d="M4 12h16"></path><path d="M4 17h16"></path></svg>
      </button>
    </div>

  function scoreResult(d, ans){

    merfolk:{t:'人魚・水棲人外の魅力：住む世界が違うふたりの、試される恋', ex:'陸と海。会うたびに試される関係と、水の中でしか見られない美しさを語ります。',
      i:'人魚ものの切なさは、だいたい「住む世界が違う」の一言に集約されます。陸では長くいられない、海では人が息をできない。それでも会いたい。……ほら、もう泣けてきた。',
      g:[['会えない時間が長い','波打ち際でしか会えない、満月の夜しか会えない。制約があるほど、会えた瞬間がまぶしい。'],['水の中の美しさ','揺れる髪、光るうろこ、泡。水中の描写が美しい作品は、それだけで価値があります。'],['歌と声','人魚といえば歌。音声作品との相性が抜群です。']],
      ty:[['人魚型','上半身が人、下半身が魚。王道。'],['深海の存在','光の届かない海の底に住む、少し怖い水棲人外。'],['水の精霊型','川や湖に住む、人に近い姿の水の存在。']],
      q:['ちょっと怖い、未知の深海にひかれる？','海より、川や湖など身近な水辺の話が好き？'], r:[[1,['merfolk','monster']],[2,['merfolk','yokai']],[0,['merfolk']]],
      tip:'声で魅せるジャンルなので、音声作品から入るのもおすすめです。', end:'住む世界が違っても会いに来てしまう。その健気さを、ぜひ。'},
    demon:{t:'悪魔・天使の魅力：契約と堕落、善悪を越えて惹かれ合う', ex:'願いと引き換えの契約、堕ちていく天使、救おうとする悪魔。背徳感が魅力のジャンルを語ります。',
      i:'悪魔と天使。対極に見えて、実はどちらも「人間とは違うルールで生きている」存在です。そのルールと人間の感情がぶつかるとき、物語が動き出します。',
      g:[['契約という名の関係','願いと対価。最初は取引だったはずの関係が、いつの間にか取引じゃなくなっていく。'],['堕ちる・救う','天使が人のために堕ちる、悪魔が人のために誓いを破る。立場を捨てる瞬間の重み。'],['美しさと危うさ','角と黒い翼、光輪と白い翼。見た目の美しさに、どこか危険な香りが混ざります。']],
      ty:[['契約悪魔','願いと引き換えに現れる、取引上手な存在。'],['堕天使','天から落ちた、光と影をあわせ持つ存在。'],['守護天使','人を見守る、規律に厳しい存在。']],
      q:['取引や駆け引きのある関係が好き？','清らかなものが揺らぐ瞬間に弱い？'], r:[[0,['demon']],[1,['demon','vampire']],[2,['demon','god']]],
      tip:'「契約の内容」が物語の鍵になることが多いので、あらすじで契約の条件をチェックしてから読むと楽しさ倍増です。', end:'悪魔に魂を売るなら、せめて推しの悪魔に。'},
    vampire:{t:'吸血鬼の魅力：不老と渇き、求めることが生きること', ex:'永遠に近い命と、血への渇き。吸血鬼ものの切実さと美しさを語ります。',
      i:'吸血鬼ものの魅力は、「相手を求めること」と「生きること」が直結しているところにあります。好きだから求める、ではなく、求めないと生きられない。この切実さは、ほかのジャンルではなかなか出せません。',
      g:[['渇きと理性','本能のままに求めたい気持ちと、相手を傷つけたくない気持ち。その葛藤が色っぽさの源です。'],['終わらない時間','年をとらない吸血鬼と、年をとっていく人間。いつか来る別れが、今を特別にします。'],['夜の美しさ','古城、月明かり、燭台。耽美な世界観が好きな人にはたまりません。']],
      ty:[['古き貴族型','何百年も生きる、気品と退屈を抱えた存在。'],['現代に生きる吸血鬼','人間社会に紛れて暮らす、少し俗っぽい吸血鬼。'],['なりたての吸血鬼','渇きに戸惑い、人間だった頃の自分と揺れる存在。']],
      q:['古城や燭台など、耽美な世界観が好き？','吸血鬼になってしまった戸惑いや葛藤が見たい？'], r:[[0,['vampire']],[2,['vampire','ghost']],[1,['vampire','kaii']]],
      tip:'「血を求める場面」の描き方は作品によってまったく違います。甘めか切なめか、試し読みで温度を確かめてから選ぶのがおすすめです。', end:'永遠の夜に、ひとりだけを選ぶ。吸血鬼もの、ぜひ。'},
    god:{t:'神・神獣の魅力：崇められる存在が、ひとりの人間に心を寄せる', ex:'土地の神、神の使い、伝説の神獣。人知を超えた存在との関係の尊さを語ります。',
      i:'神さま。世界のルールそのものみたいな存在が、ひとりの人間を気にかける。その時点で、もう物語としてずるいんですよ。',
      g:[['格の違い','祈られる側と、祈る側。立場の差があるからこそ、対等に話せた瞬間が光ります。'],['約束と加護','神との約束は重い。守られるのも、破るのも、物語の大事件になります。'],['人の世界とのずれ','時間の感覚も、善悪の基準も、人とは少しずつ違う。そのずれが愛おしいんです。']],
      ty:[['土地の神','山や川、社に宿る、その土地とともにある神。'],['神獣','白い獣や霊鳥など、神の力を持つ獣の姿の存在。'],['異国の神','神話に出てくるような、人とかけ離れた存在。']],
      q:['獣の姿をした、神々しい存在にひかれる？','和風の社や、昔からの言い伝えが好き？'], r:[[1,['god','kemono']],[0,['god','yokai']],[2,['god','dragon']]],
      tip:'神ものは「供物」「祀る」「名前」などの儀式的な要素が多いジャンル。その設定が丁寧な作品ほど、関係の重みが増します。', end:'神さまに見つかってしまった人生、悪くないと思いませんか。'},
    ishu:{t:'異種族（エルフなど）の魅力：人に近くて、人とは違う時間を生きる', ex:'エルフ、ドワーフ、遠い土地の種族。ファンタジーの入り口にぴったりな異種族ものの魅力を語ります。',
      i:'異種族ものは、人外ジャンルのいちばんやさしい入り口です。見た目は人に近い。でも寿命や文化、価値観がちょっとずつ違う。この「ちょっとずつ」が、じわじわ効いてきます。',
      g:[['見た目は人に近い','人外度が低めなので、人外ものが初めてでも入りやすい。'],['寿命の差','何百年も生きるエルフにとって、人間の一生は短すぎる。その差が切なさを生みます。'],['文化の違い','食べ物、礼儀、愛情表現。すれ違いから始まる関係は、だいたい名作です。']],
      ty:[['エルフ','長命で美しく、少し人間を見下している（最初は）。'],['ドワーフ','頑固で職人気質、でも情に厚い。'],['未知の種族','言葉も文化も分からない、遠い土地の種族。']],
      q:['寿命の差の切なさに弱い？','頑固な職人気質の相手が好き？'], r:[[0,['ishu','vampire']],[1,['ishu']],[2,['ishu','alien']]],
      tip:'異種族ものは、文化の違いの描き方で面白さが決まります。あらすじに「価値観の違い」がありそうな作品を探してみてください。', end:'人に近いからこそ際立つ違い。異種族もの、ぜひ入り口に。'},
    kaii:{t:'都市伝説・怪異の魅力：日常の隣にいる「何か」に見初められる', ex:'八尺様のような、条件がそろうと現れる正体不明の存在。怖さと引力の正体を語ります。',
      i:'いつもの帰り道。生け垣の向こうに、ありえない高さの帽子が見える。……都市伝説・怪異ものの怖さは、それが日常のすぐ隣にあるところです。そして、そんな「何か」に気に入られてしまう話に、どうしようもなくひかれてしまうんです。（和風・怪異系全体の語りは<a href="#article-7">こちらの記事</a>でもしています）',
      g:[['正体が分からない','何者なのか、なぜ自分なのか。分からないことが、そのまま魅力になります。'],['ルールがある','「目を合わせてはいけない」「返事をしてはいけない」。決まりごとと、それが破られる瞬間。'],['逃げられない執着','人の理屈が通じない相手の「気に入った」は、ちょっとやそっとでは終わりません。']],
      ty:[['条件で現れる怪異','特定の場所、時間、行動で現れる存在。'],['ネット発の怪異','掲示板や噂話から広まった、新しい怪異。'],['名前のない「何か」','名前すら分からない、説明できない存在。']],
      q:['決まった場所や時間に現れる、ルールのある怪異が好き？','噂やネットの書き込みから広がる怖さにひかれる？'], r:[[0,['kaii']],[1,['kaii','ghost']],[2,['kaii','monster']]],
      tip:'音声作品で、夜に。これ以上は言いません。', end:'怖いのに、また読んでしまう。それがあなたの答えです。'},
    oni:{t:'鬼の魅力：角と怪力、でも約束は絶対に守る', ex:'荒々しさと義理堅さのギャップ。和の世界観で輝く鬼ものの魅力を語ります。',
      i:'鬼。昔話では退治される側ですが、人外ものでは話が変わります。豪快で、力が強くて、酒が好きで、でも一度した約束は何百年たっても守る。……ずるくないですか？',
      g:[['豪快さと優しさのギャップ','大声で笑って、片手で岩を持ち上げる。なのに、人間の小さな手を握るときだけ、やけに慎重。'],['約束を守る','鬼は嘘をつかない、という言い伝えも。その誠実さが、関係に安心感をくれます。'],['和の世界観','山、祭り、酒、月。和風の舞台装置と相性抜群です。']],
      ty:[['山の鬼','人里離れた山に住む、荒々しい鬼。'],['都の鬼','人に化けて都に紛れる、知略の鬼。'],['鬼の一族','一族の掟やしきたりの中で生きる鬼。']],
      q:['人に化けて正体を隠しているのが好き？','一族の掟やしがらみが絡む話にひかれる？'], r:[[1,['oni','yokai']],[2,['oni']],[0,['oni','monster']]],
      tip:'鬼ものは「約束」が物語の鍵になることが多いです。誰と、どんな約束をしたのかに注目して読んでみてください。', end:'角があっても、怪力でも、約束を守る相手は信じられる。鬼もの、ぜひ。'},
    yokai:{t:'妖怪・あやかしの魅力：狐や天狗との、古い約束の物語', ex:'狐、天狗、猫又。昔話に根ざした存在との、時間を越えた関係を語ります。',
      i:'あやかしものの魅力は、「昔からそこにいた」存在との関係です。子どもの頃に会ったことがある、先祖が約束を交わした。そんな古い縁が、今になって動き出す。',
      g:[['古い縁','何十年、何百年前の約束が、今の物語につながる。時間のスケールがエモいんです。'],['化ける、だます','狐や狸は化ける。本当の姿はどれなのか、どこまでが本心なのか。その曖昧さが楽しい。'],['ふたつの世界の境目','神社、鳥居、夕暮れ時。人の世界とあやかしの世界を行き来する雰囲気がたまりません。']],
      ty:[['狐','化けるのが得意で、気まぐれ。尾が増えるほど力が強い。'],['天狗','山に住む、誇り高く強い存在。'],['猫又・化け猫','長く生きた猫が変化した、気ままな存在。']],
      q:['化かす・化かされる駆け引きが好き？','山の上の、誇り高い存在にひかれる？'], r:[[0,['yokai','kemono']],[1,['yokai','bird']],[2,['yokai','kemono']]],
      tip:'和風あやかしは、怖さよりも切なさが前に出る作品が多め。ホラーが苦手な人の怪異系入門にもおすすめです。', end:'夕暮れの鳥居の向こうで、誰かが待っているかもしれません。'},
    ghost:{t:'幽霊・霊体の魅力：触れられない相手と、いつか来る別れ', ex:'見えるのに触れられない、そこにいるのに、いつ消えるか分からない。はかなさが魅力のジャンルを語ります。',
      i:'幽霊ものは、人外ジャンルの中でもいちばん切ないかもしれません。手を伸ばしてもすり抜ける。いつか成仏してしまうかもしれない。それでも一緒にいたい。……書いているだけで泣きそうです。',
      g:[['触れられない','触れられないからこそ、言葉や視線の一つひとつが大事になります。'],['未練と成仏','未練があるからここにいる。それが解消されたら、いなくなってしまう。この矛盾。'],['見えるのは自分だけ','ふたりだけの秘密の関係。周りから見たら、独り言を言っている人。']],
      ty:[['そばにいる幽霊','部屋や場所に縛られた、穏やかな幽霊。'],['怨霊・悪霊','強い執着を持つ、少し怖い霊。'],['守護霊','ずっと昔から見守ってくれていた存在。']],
      q:['少し怖いくらいの、強い執着がほしい？','ずっと見守ってくれていた、という設定に弱い？'], r:[[1,['ghost','kaii']],[2,['ghost','god']],[0,['ghost']]],
      tip:'幽霊ものは結末で印象が大きく変わります。切ないのが苦手な人は、レビューで結末の温度だけ確認しておくと安心です。', end:'触れられなくても、そばにいる。その尊さを、ぜひ。'},
    machine:{t:'機械・ロボットの魅力：感情を知らない存在が、心を学んでいく', ex:'アンドロイド、ロボット、AI。作られた存在が人間を理解していく過程の尊さを語ります。',
      i:'機械ものの醍醐味は、なんといっても「学習」です。感情を知らない、命令しか理解できない存在が、少しずつ人間の気持ちを覚えていく。その成長記録を、特等席で見られるジャンルです。（作られた存在全般の語りは<a href="#article-5">こちらの記事</a>でもしています）',
      g:[['初めての感情','「この反応の名前が分かりません」。それ、恋ですよ。'],['命令と意思','プログラムされた役割を、自分の意思で越えていく瞬間。'],['人間より人間らしい','人間の嘘やごまかしを知らないぶん、まっすぐな言葉が刺さります。']],
      ty:[['アンドロイド','人そっくりの見た目に、機械の中身。'],['ロボット','いかにも機械な体。不器用な優しさ。'],['AI・電子の存在','体を持たない、声と言葉だけの存在。']],
      q:['見た目は人間そっくりがいい？','体がなくても、言葉だけで関係が成り立つ話が好き？'], r:[[0,['machine','doll']],[2,['machine','ghost']],[1,['machine']]],
      tip:'機械ものは「メンテナンス」「記録」「起動」など、機械ならではの場面が見どころ。そこが丁寧な作品を選ぶと満足度が高いです。', end:'心を学んだ機械は、たぶん人間より一途です。'},
    doll:{t:'人形・ゴーレムの魅力：作られた存在の、主への一途さ', ex:'動く人形、球体関節、土のゴーレム。作り手との関係と、芽生える自我を語ります。',
      i:'人形やゴーレムは、魔法や呪い、職人の技で「作られた」存在です。作り手がいる、という一点だけで、関係にものすごい重みが生まれます。',
      g:[['作り手との関係','自分を作った人、自分を直してくれる人。その相手に向ける感情は、ほかのどんな関係とも違います。'],['美しさと不気味さ','精巧な人形の顔、関節の継ぎ目。きれいなのに、どこか怖い。'],['自我の芽生え','動くはずのない人形が、自分の意思を持ち始める瞬間。']],
      ty:[['球体関節人形','美しく精巧な、魂の宿った人形。'],['ゴーレム','土や石でできた大きな体。主を守る忠実な存在。'],['からくり人形','歯車とぜんまいで動く、和の機械仕掛け。']],
      q:['大きくて寡黙な、守ってくれる存在が好き？','和風の世界観が好き？'], r:[[1,['doll','monster']],[2,['doll','yokai']],[0,['doll','machine']]],
      tip:'人形ものは「誰が作ったのか」で物語の方向が決まります。作り手との関係がしっかり描かれている作品を選んでみてください。', end:'作られた存在の一途さに、ぜひ溺れてください。'},
    monster:{t:'モンスター・クリーチャーの魅力：人ならざる見た目と、優しい中身', ex:'異形の姿、大きな体、いくつもの目。見た目と中身のギャップが魅力のジャンルを語ります。',
      i:'モンスターものの魅力は、ずばりギャップです。見た瞬間に逃げ出したくなるような姿なのに、中身はとても優しい。もしくは、見た目どおり危険なのに、自分にだけは優しい。どっちもおいしい。',
      g:[['見た目と中身の落差','恐ろしい姿の存在が、花を摘んできてくれる。この落差だけでご飯が進みます。'],['言葉がいらない関係','言葉を持たないクリーチャーとの、仕草だけのコミュニケーション。'],['世界にひとつの姿','決まった形がないぶん、作者の想像力が爆発するジャンル。']],
      ty:[['大型の魔物','見上げるほど大きな、迷宮や森の主。'],['異形のクリーチャー','いくつもの目や腕を持つ、説明しがたい存在。'],['人型のモンスター','人に近い形だけど、どこかが決定的に違う存在。']],
      q:['見上げるほど大きい存在に守られたい？','説明できないくらい異形なほど、ゾクっとする？'], r:[[0,['monster','dragon']],[1,['monster','kaii']],[2,['monster','reptile']]],
      tip:'見た目の好みが強く出るジャンルなので、試し読みで「この姿なら好き」と思えるかを必ず確認してください。', end:'怖い見た目ほど、優しさがしみる。モンスターもの、ぜひ。'},
    slime:{t:'スライム・不定形の魅力：形が決まっていない存在の自由さ', ex:'ぷるぷる、とろとろ、形を変える体。ほかにない独特の表現が魅力のジャンルを語ります。',
      i:'スライム、不定形。人外の中でも、かなり上級者向けに見えるジャンルです。でも実は、「形が決まっていない」というのは、どんな姿にもなれるということ。その自由さが魅力です。',
      g:[['どんな姿にもなれる','相手の好みに合わせて姿を変える。その健気さがたまりません。'],['独特の感触','ぷるぷる、ひんやり。ほかのジャンルでは出せない質感の描写。'],['個体と群れ','ひとつの体が分かれたり、まとまったり。「自分とは何か」がゆらぐ存在。']],
      ty:[['スライム型','ぷるぷるした、かわいらしさもある不定形。'],['擬態型','人の姿をまねる、正体不明の不定形。'],['液体・霧の存在','水や霧のように、つかめない存在。']],

  }

  const viewEl = document.getElementById('view');
  function render(top){
    const h = (location.hash || '#home').slice(1);
    let html;
    if (h.startsWith('article-')) html = views.article(h.slice(8));
    else if (h.startsWith('genre-')) html = views.genre(h.slice(6));
    else if (h.startsWith('cat-')) html = views.cat(h.slice(4));
    else if (views[h]) html = views[h]();
    else html = views.home();
    viewEl.innerHTML = html;
    bindCarousel();
    const h1 = viewEl.querySelector('h1');
    document.title = (h === 'home' || !h1) ? '人外ノ閨｜ヒトでは満たされない夜に。' : h1.textContent + '｜人外ノ閨';
    if (top) window.scrollTo(0,0);
    closePanels();
  }
  window.addEventListener('hashchange', () => render(true));

  viewEl.addEventListener('click', e => {
    const da = e.target.closest('[data-dans]');
    if (da) { const id = da.dataset.dans; diagAct(id, s2 => { if (DIAGS[id].type === 'score') { s2.ans.push(da.dataset.v); return; } const n = DIAGS[id].nodes[s2.cur]; s2.hist.push(s2.cur); s2.cur = n[da.dataset.v]; }); const el = document.querySelector(`[data-diag="${id}"] .dbody`); if (el) el.focus(); return; }
    const db = e.target.closest('[data-dback]');
    if (db) { diagAct(db.dataset.dback, s2 => { if (s2.ans) { s2.ans.pop(); s2.counted = false; return; } if (s2.hist.length) s2.cur = s2.hist.pop(); }); return; }
    const dr = e.target.closest('[data-dreset]');
    if (dr) { const id = dr.dataset.dreset; diagAct(id, s2 => { if (s2.ans) { s2.ans = []; s2.counted = false; return; } s2.cur = DIAGS[id].start; s2.hist = []; }); return; }
    const stp = e.target.closest('[data-step]'); if (stp) { slideTo(curSlide() + Number(stp.dataset.step)); return; }
    const dot = e.target.closest('[data-dot]'); if (dot) { slideTo(Number(dot.dataset.dot)); return; }
    const c = e.target.closest('[data-c]'), g = e.target.closest('[data-g]');
    if (c || g) {
      const set = c ? st.c : st.g, k = c ? c.dataset.c : g.dataset.g;
      set.has(k) ? set.delete(k) : set.add(k);
      const y = window.scrollY; render(false); window.scrollTo(0, y); return;
    }
    if (e.target.id === 'clear-tags') { st.c.clear(); st.g.clear(); st.q = ''; render(false); }
  });
  viewEl.addEventListener('input', e => {
    if (e.target.id === 'q2') {
      st.q = e.target.value;
      const pos = e.target.selectionStart, y = window.scrollY;
      render(false); window.scrollTo(0, y);
      const el = document.getElementById('q2'); el.focus(); el.setSelectionRange(pos, pos);
    }
    if (e.target.id === 'c-text' || e.target.id === 'c-name') { const er = document.getElementById('c-err'); if (er) er.textContent = ''; }
  });
  let lastPost = 0;
  function contactSubmit(){
    const err = document.getElementById('ct-err'), st2 = document.getElementById('ct-status');
    const body = document.getElementById('ct-body').value.trim(), mail = document.getElementById('ct-mail').value.trim();
    err.textContent = '';
    if (!body) { err.textContent = '内容を入力してください。'; return; }
    if (mail && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)) { err.textContent = 'メールアドレスの形式を確認してください。'; return; }
    if (!document.getElementById('ct-agree').checked) { err.textContent = 'プライバシーポリシーへの同意にチェックを入れてください。'; return; }
    if (document.getElementById('ct-web').value) return;
    st2.innerHTML = '<div class="cstatus ok">試作のため送信はされません。本番では内容を保存し、管理人に通知が届きます。</div>';
  }
  viewEl.addEventListener('submit', e => {
    if (e.target.id === 'contact-form') { e.preventDefault(); contactSubmit(); return; }
    if (e.target.id !== 'cform') return;
    e.preventDefault();
    const id = e.target.dataset.id;
    const name = document.getElementById('c-name').value.trim() || '名無しの人外好き';
    const text = document.getElementById('c-text').value.trim();
    const err = document.getElementById('c-err'), status = document.getElementById('c-status');
    if (text.length < 5) { err.textContent = 'コメントは5文字以上で入力してください。'; return; }
    if (document.getElementById('c-web').value) { status.innerHTML = '<div class="cstatus ok">確認が終わり、コメントを表示しました。</div>'; return; }
    if (Date.now() - lastPost < 30000) { err.textContent = '連続での投稿はできません。30秒ほど時間をおいてください。'; return; }
    lastPost = Date.now();
    status.innerHTML = '<div class="cstatus wait">内容を確認しています…</div>';
    setTimeout(() => {
      const ng = moderate(name + ' ' + text);
      if (ng) { status.innerHTML = `<div class="cstatus ng">このコメントは表示できません：${ng}</div>`; return; }
      const d = new Date();
      (COMMENTS[id] = COMMENTS[id] || []).push({name, text, date:`${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`});
      const y = window.scrollY; render(false); window.scrollTo(0, y);
      document.getElementById('c-status').innerHTML = '<div class="cstatus ok">確認が終わり、コメントを表示しました。ありがとうございます。</div>';
    }, 900);
  });

  document.getElementById('menu-grid').innerHTML =
    `<div class="mg"><h3>記事の種類</h3>${Object.entries(CATS).map(([k,c])=>`<a href="#cat-${k}">${c}</a>`).join('')}<a href="#search">タグで探す</a></div>` +
    GROUPS.map(g => `<div class="mg"><h3>${g.name}</h3>${g.items.map(([k,n])=>`<a href="#genre-${k}">${n}</a>`).join('')}</div>`).join('') +
    `<div class="mg"><h3>サイト情報</h3><a href="#about">このサイトについて</a><a href="#operator">運営者情報</a><a href="#contact">お問い合わせ</a><a href="#home">トップへ戻る</a></div>`;

  const pM = document.getElementById('panel-menu');
  const bS = document.getElementById('btn-search'), bM = document.getElementById('btn-menu');
  function closePanels(){ pM.hidden = true; bM.setAttribute('aria-expanded','false'); }
  bS.addEventListener('click', () => { closePanels(); if (location.hash === '#search') render(true); else location.hash = 'search'; setTimeout(() => { const q = document.getElementById('q2'); if (q) q.focus(); }, 0); });
  bM.addEventListener('click', () => { const open = pM.hidden; closePanels(); pM.hidden = !open; bM.setAttribute('aria-expanded', String(open)); });
  pM.addEventListener('click', e => { if (e.target.closest('a')) closePanels(); });

  const gate = document.getElementById('gate'), KEY = 'jingai_neya_age_ok';
  function ok(){ try { const v = Number(localStorage.getItem(KEY)); return v && Date.now() - v < 30*864e5; } catch(e){ return false; } }
  if (ok()) gate.hidden = true; else document.body.style.overflow = 'hidden';
  document.getElementById('gate-yes').addEventListener('click', () => { try { localStorage.setItem(KEY, String(Date.now())); } catch(e){} gate.hidden = true; document.body.style.overflow = ''; });
  document.getElementById('gate-no').addEventListener('click', () => { document.getElementById('gate-msg').textContent = '18歳未満の方はご覧いただけません。本番では一般向けのページへ移動します。'; });
  document.getElementById('reset-gate').addEventListener('click', () => { try { localStorage.removeItem(KEY); } catch(e){} gate.hidden = false; document.body.style.overflow = 'hidden'; window.scrollTo(0,0); });

  render(false);
})();
</script>
</body>
</html>
